<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBAN STYLE | Clothing Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        nav {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
        }

        .hero {
            background: #dedede;
            text-align: center;
            padding: 65px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero p {
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: #111;
            color: white;
            padding: 13px 22px;
            text-decoration: none;
            border-radius: 4px;
        }

        .products {
            padding: 40px 20px;
            text-align: center;
        }

        .products h2 {
            margin-bottom: 25px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .product {
            background: white;
            padding-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px #ddd;
        }

        .product img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .product h3 {
            margin: 15px 0 8px;
        }

        .product p {
            margin-bottom: 15px;
        }

        .contact {
            background: #e9e9e9;
            text-align: center;
            padding: 40px 20px;
        }

        .contact p {
            margin: 15px 0;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <header>
        <h1>URBAN STYLE</h1>
        <p>Fashion that speaks for you.</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Collection</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero" id="home">
        <h2>Find Your Style</h2>
        <p>Discover everyday fashion for every occasion.</p>
        <a href="#products" class="button">Explore Collection</a>
    </section>

    <section class="products" id="products">
        <h2>Our Collection</h2>

        <div class="product-grid">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80" alt="Casual T-shirt">
                <h3>Classic T-Shirt</h3>
                <p>Example price: KSh 800</p>
                <a href="#contact" class="button">Enquire</a>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=600&q=80" alt="Casual jeans">
                <h3>Classic Jeans</h3>
                <p>Example price: KSh 1,800</p>
                <a href="#contact" class="button">Enquire</a>
            </div>
